version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: airevenue-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-airevenue}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-airevenue}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airevenue-net

  redis:
    image: redis:7-alpine
    container_name: airevenue-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - airevenue-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: airevenue-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-airevenue}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres_secure_pass_2026}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET:-your_super_secret_jwt_key_256_bit_minimum_here_2026}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-http://localhost:3000/integrations/google/callback}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID:-rzp_test_TYP96qdegz7nIV}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET:-kZjnPVYSUgf5kT2Cz4QkpGuk}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET:-}
    ports:
      - "8080:8080"
    networks:
      - airevenue-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: airevenue-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8080}
      NEXT_PUBLIC_RAZORPAY_KEY_ID: ${NEXT_PUBLIC_RAZORPAY_KEY_ID:-rzp_test_TYP96qdegz7nIV}
    ports:
      - "3000:3000"
    networks:
      - airevenue-net

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  airevenue-net:
    driver: bridge
